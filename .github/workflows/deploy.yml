name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP Artifact Registry
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build & Push Backend Docker Image
        run: |
          IMAGE_URI="asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/justmemes/backend:${{ github.sha }}"
          LATEST_URI="asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/justmemes/backend:latest"
          
          docker build -t $IMAGE_URI -t $LATEST_URI .
          docker push $IMAGE_URI
          docker push $LATEST_URI

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy justmemes-backend \
            --image asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/justmemes/backend:${{ github.sha }} \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "PHONEPE_MERCHANT_ID=${{ secrets.PHONEPE_MERCHANT_ID }},PHONEPE_SALT_KEY=${{ secrets.PHONEPE_SALT_KEY }},PHONEPE_SALT_INDEX=${{ secrets.PHONEPE_SALT_INDEX || '1' }},PHONEPE_ENV=${{ secrets.PHONEPE_ENV || 'UAT' }},MONGODB_URI=${{ secrets.MONGODB_URI }}"
